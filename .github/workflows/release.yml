name: Release

on:
  push:
    branches: [main, master]
    paths:
      - custom_components/nobreak/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read manifest version
        id: version
        run: echo "version=$(jq -r .version custom_components/nobreak/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Zip integration
        run: cd custom_components/nobreak && zip -r "$GITHUB_WORKSPACE/nobreak.zip" . -x '__pycache__/*'
      - name: Create release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "invalid manifest version '$VERSION'"; exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" "nobreak.zip" --title "$TAG" --generate-notes
          fi
